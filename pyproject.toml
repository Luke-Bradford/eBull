[project]
name = "ebull"
version = "0.1.0"
description = "Long-horizon AI-assisted investment engine for eToro"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "anthropic>=0.40.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  # pydantic-settings floor bumped for GHSA-4xgf-cpjx-pc3j (fixed 2.14.2),
  # surfaced by pip-audit on PR #1682 CI (ambient — not introduced by this PR).
  "pydantic-settings>=2.14.2",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "httpx>=0.27.0",
  "argon2-cffi>=23.1.0",
  # Floors bumped for supply-chain advisories surfaced on PR #1651 CI:
  # cryptography GHSA-537c-gmf6-5ccf (fixed 48.0.1); starlette (fastapi transitive,
  # pinned directly here) CVE-2026-48817/48818/54282/54283 (fixed 1.3.1).
  # cryptography floor re-raised to 50.0.0 for CVE-2026-69247 (pip-audit --strict
  # failed the supply-chain job on every PR while the lock resolved to 49.0.0).
  "cryptography>=50.0.0",
  "starlette>=1.3.1",
  "platformdirs>=4.2.0",
  "apscheduler>=3.10",
  "redis[hiredis]>=5.0.0",
  "edgartools==5.30.2",
  "pandas>=3.0.2",
  # #2311: imported DIRECTLY by app/services/indicator_series.py (window
  # indicators) and app/services/risk_metrics.py (skew / kurtosis / percentile).
  # It already resolved transitively as a `pandas` dependency — declared here so
  # a direct import is not leaning on somebody else's transitive dep. ⚠ The
  # risk_metrics import predates this line: the dependency was undeclared, not
  # absent, and a pandas release that dropped numpy would have broken scoring
  # with no diff to point at. Same reasoning as the `watchfiles` entry below.
  # The features used (`sliding_window_view`, `ndarray.var`) date to 1.20; the
  # floor is the major version the lock resolves within (2.4.4).
  "numpy>=2.0",
  "numba>=0.66,<0.67",
  "openpyxl>=3.1.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.4.0",
  "pyright>=1.1.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-xdist>=3.5",
  "pytest-testmon>=2.2",
  "httpx>=0.27.0",
  # Stream A PR-B T1.3 (#1233): contract test for
  # sec_submissions_files_walk (S14) asserts ZERO PRIMARY-page HTTP
  # calls when the sidecar is populated. respx mocks httpx at the
  # transport layer — smallest primitive that satisfies the contract.
  "respx>=0.21",
  # #2144: app/jobs/dev_reload.py imports watchfiles DIRECTLY for the
  # dev-only jobs-daemon auto-reload. It already resolves transitively as a
  # `uvicorn[standard]` extra (uv.lock pins 1.1.1) — declared here so a
  # direct import is not leaning on somebody else's transitive dep, and in
  # the dev group because the import is lazy inside the dev-only path.
  "watchfiles>=1.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.14"
# NOTE: pyright's `strict` key takes an ARRAY OF PATHS, not a boolean. `strict = false`
# made every run print `Config "strict" entry must contain an array` — permanent noise on a
# gate, which is how a real message gets skimmed past. Omitting it is the correct spelling
# of "no strict-mode paths" and is what the boolean was trying to say.

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --tb=short -n 4 --durations=20 --dist=loadgroup"
markers = [
  "integration: marks tests that require a live Postgres connection (deselect with -m 'not integration')",
  "perf: tests requiring real DB and long wall-clock; nightly tier (deselect with -m 'not perf')",
]
