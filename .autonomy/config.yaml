board:
  owner: Luke-Bradford
  project_title: "eBull engineering board"

engine:
  requires_claude_md: true

agent:
  type: claude
  model:
    primary: claude-opus-4-8
    fallback: claude-sonnet-4-6

merge_gate:
  strategy: bot_comment
  author_login: github-actions
  marker: "Claude Code Review"
  doc_only_extensions: [".md"]
  # Required by safe_merge.sh's bot_comment gate: it computes
  # doc_only_paths="$(CONFIG_GET merge_gate.doc_only_paths | paste -sd, -)"
  # under `set -euo pipefail`, so a MISSING key makes CONFIG_GET exit
  # non-zero, the pipeline fail, and the whole merge gate abort silently
  # (exit 1, no message) BEFORE the `:-docs/` default or any gate check
  # runs — blocking every merge. Set it explicitly to the engine's
  # intended default. Only affects the doc-only fast-path classification
  # (a PR whose every file is doc-only); non-doc PRs still require the
  # full bot-APPROVE-on-latest-commit gate.
  doc_only_paths: ["docs/"]
  # #2849: declared rather than left to safe_merge.sh's hardcoded default, for
  # the same reason doc_only_paths is above — a default that only exists in the
  # engine is invisible to anything else that has to agree with it, and
  # .github/workflows/claude-review.yml has to agree with it. Exclusions BEAT
  # both the extension and the path test: a file under .autonomy/ is never
  # doc-only, because loop_prompt.md is the standing order an unattended loop
  # executes.
  # ⚠ All three lists above are bound to that workflow's inline patterns by
  # tests/test_doc_only_classification_agreement.py — editing either side alone
  # fails it. The earlier "keep this list identical" instruction did not hold:
  # the excludes were reconciled and doc_only_extensions was not, leaving an
  # .rst-only PR unmergeable by construction until #2849's second pass.
  doc_only_excludes: [".autonomy/"]
